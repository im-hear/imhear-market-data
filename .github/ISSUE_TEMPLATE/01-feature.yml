name: 기능 개발
description: 사용자 기능과 개발 작업의 완료 기준을 정합니다.
title: "[Feat] "
body:
  - type: textarea
    id: progress
    attributes:
      label: 진행 체크리스트
      description: 한 PR에서 완료할 작업을 체크리스트로 적어 주세요.
      placeholder: "- [ ] 작업 항목"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표와 배경
      description: 누구의 어떤 문제를 해결하는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
      description: 담당 도메인과 변경할 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 검증 가능한 수용 기준
      placeholder: "- [ ] 유효한 사용자 승인에서 주문이 한 번만 체결된다."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 관련 저장소와 의존 작업
      description: 영향받는 API, 이벤트, 스키마 또는 연결 이슈가 있으면 적어 주세요.
