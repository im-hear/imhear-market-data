name: 기능 개발
description: 만들거나 고치고 싶은 기능을 적어요.
title: "[Feat] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 어떤 기능이 필요해요?
      placeholder: 관심 종목에 새 공시가 올라오면 알림을 받고 싶어요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 정해진 작업이 있으면 체크리스트로 적어 주세요.
      placeholder: "- [ ] 알림센터에 공시 제목과 링크 표시"
