name: 버그 신고
description: 재현 경로와 기대 동작을 공유합니다.
title: "[Fix] "
body:
  - type: textarea
    id: progress
    attributes:
      label: 진행 체크리스트
      description: 한 PR에서 완료할 작업을 체크리스트로 적어 주세요.
      placeholder: "- [ ] 작업 항목"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 버전, 실행 환경, 입력과 재현 순서를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 실제 동작
      description: 관찰한 결과나 오류를 적어 주세요. 개인 정보와 토큰은 지워 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 수정 이후 확인할 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 추가 근거
      description: 익명화한 로그, 화면, 발생 시각 또는 관련 이슈를 첨부해 주세요.
