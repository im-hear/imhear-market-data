name: 버그 신고
description: 쓰다가 겪은 문제를 알려 주세요.
title: "[Fix] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 있었어요?
      placeholder: 주문을 승인했는데 체결 결과가 안 보여요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 어떤 상황에서 문제가 생겼어요?
      description: 어떤 화면에서 무엇을 했는지 적어 주세요. 스크린샷이 있으면 붙여도 좋아요.
