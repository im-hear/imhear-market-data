name: 저장소 간 변경
description: API나 이벤트처럼 여러 저장소에서 함께 쓰는 내용을 바꿀 때 골라 주세요.
title: "[Chore] "
body:
  - type: textarea
    id: change
    attributes:
      label: 무엇을 바꾸려고 해요?
      placeholder: 시세 응답에 가격을 받은 시각을 넣으려고 해요.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 같이 바꿀 곳이 있나요?
      description: 다른 저장소나 연결된 이슈가 있으면 적어 주세요. 먼저 해야 할 일이 있으면 함께 알려 주세요.
